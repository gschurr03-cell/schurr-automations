/* Editorial rhythm: focus the commitment, supporting copy, and next action.
   Load after the brand and motion layers. The approved opening is unchanged. */
:root {
  --editorial-space: clamp(56px, 5.9vw, 88px);
  --editorial-gap: clamp(32px, 5vw, 72px);
}

/* Secondary reading sections use the same deliberate vertical rhythm. */
:where(body:not(.about-studio)) .section:has(> .editorial-split):not(:where(.about-studio *)),
:where(body:not(.about-studio)) .flow-section:not(:where(.about-studio *)) {
  padding-block: var(--editorial-space);
}
:where(body:not(.about-studio)) .editorial-split:not(:where(.about-studio *)) {
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: var(--editorial-gap);
  align-items: start;
}
:where(body:not(.about-studio)) .editorial-split:not(:where(.about-studio *)) > div {
  min-width: 0;
}
:where(body:not(.about-studio)) .editorial-split:not(:where(.about-studio *)) h2,
:where(body:not(.about-studio)) .flow-section:not(:where(.about-studio *)) h2 {
  max-width: 23ch;
  font-size: clamp(32px, 3.1vw, 44px);
  line-height: 1.16;
  letter-spacing: -.04em;
  text-wrap: balance;
}
:where(body:not(.about-studio)) .editorial-split:not(:where(.about-studio *)) .eyebrow,
:where(body:not(.about-studio)) .flow-section:not(:where(.about-studio *)) .eyebrow {
  margin-bottom: 18px;
}
:where(body:not(.about-studio)) .editorial-split:not(:where(.about-studio *)) > div > p {
  margin-top: 20px;
  max-width: 48ch;
  font-size: 18px;
  line-height: 1.65;
}
:where(body:not(.about-studio)) .editorial-split:not(:where(.about-studio *)) > .prose > p:first-child {
  margin-top: 0;
}
:where(body:not(.about-studio)) .detail-list:not(:where(.about-studio *)) article {
  padding-block: 24px;
}
:where(body:not(.about-studio)) .detail-list:not(:where(.about-studio *)) article:first-child {
  padding-top: 0;
}
:where(body:not(.about-studio)) .detail-list:not(:where(.about-studio *)) article:last-child {
  padding-bottom: 0;
}
:where(body:not(.about-studio)) .detail-list:not(:where(.about-studio *)) h3 {
  margin-bottom: 10px;
  font-size: clamp(21px, 1.8vw, 24px);
  line-height: 1.3;
  max-width: 30ch;
}
:where(body:not(.about-studio)) .detail-list:not(:where(.about-studio *)) p {
  font-size: 17px;
  line-height: 1.65;
}

/* The promise reads as one composition, with evidence beside it. */
.section.guarantee-section {
  padding-block: clamp(54px, 5.4vw, 80px);
}
.guarantee-section .editorial-split {
  grid-template-columns: minmax(0, 1.45fr) minmax(0, .85fr);
  gap: clamp(36px, 5.5vw, 80px);
  align-items: center;
}
.guarantee-section .editorial-split > div:first-child {
  padding-inline-start: clamp(20px, 2.1vw, 30px);
  border-inline-start: 2px solid #9e75cb;
}
.guarantee-section .editorial-split .eyebrow,
.guarantee-section > .container > .eyebrow {
  margin-bottom: 20px;
}
.guarantee-section .editorial-split h2,
.guarantee-copy h2 {
  max-width: 30ch;
  font-size: clamp(30px, 3vw, 42px);
  line-height: 1.19;
  letter-spacing: -.038em;
  text-wrap: balance;
}
.guarantee-section .editorial-split > .prose {
  padding-top: 22px;
  border-top: 1px solid #705183;
}
.guarantee-section .editorial-split > .prose > p {
  margin: 0 0 18px;
  max-width: 39ch;
  font-size: 18px;
  line-height: 1.65;
  color: #ded5e8;
}
.guarantee-section .prose .text-link {
  display: inline-flex;
  align-items: center;
  min-height: 44px;
  max-width: 100%;
  margin: 0;
  padding-block: 8px;
  font-size: 16px;
  line-height: 1.45;
  text-decoration-thickness: 1px;
  text-underline-offset: 5px;
}
.guarantee-layout {
  grid-template-columns: minmax(0, .52fr) minmax(0, 1.48fr);
  gap: var(--editorial-gap);
  align-items: start;
}
.guarantee-layout > div:first-child {
  padding-top: 5px;
}
.guarantee-layout .ninety {
  display: block;
  font-size: clamp(100px, 11vw, 148px);
  line-height: .9;
}
.guarantee-layout .days {
  max-width: 24ch;
  margin-top: 18px;
  font-size: 12px;
  line-height: 1.55;
  letter-spacing: .12em;
}
.guarantee-copy p {
  margin-top: 22px;
  max-width: 52ch;
  font-size: 18px;
  line-height: 1.65;
}
.guarantee-copy .button {
  margin-top: 24px;
}

/* Content determines the CTA column width, keeping it near the invitation. */
.section.page-close {
  padding-block: clamp(48px, 5vw, 76px);
}
.page-close-inner {
  max-width: 1120px;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: clamp(32px, 4.7vw, 68px);
  align-items: center;
}
.page-close-inner > div {
  min-width: 0;
  max-width: 690px;
}
.page-close .eyebrow {
  margin-bottom: 17px;
}
.page-close h2 {
  max-width: 25ch;
  font-size: clamp(30px, 3vw, 42px);
  line-height: 1.17;
  letter-spacing: -.04em;
  text-wrap: balance;
}
.page-close p {
  margin-top: 18px;
  max-width: 54ch;
  font-size: 18px;
  line-height: 1.65;
}
.page-close .button {
  min-height: 50px;
  justify-self: start;
  max-width: 100%;
  text-align: center;
  padding: 15px 24px;
}

/* Process and scope rows are connected by fine rules, with clear reading order. */
:where(body:not(.about-studio)) .flow-list:not(:where(.about-studio *)) {
  margin-top: 34px;
  gap: clamp(24px, 3.6vw, 48px);
  grid-template-columns: repeat(3, minmax(0, 1fr));
}
:where(body:not(.about-studio)) .flow-list:not(:where(.about-studio *)) li > span {
  padding-top: 16px;
  margin-bottom: 20px;
}
:where(body:not(.about-studio)) .flow-list:not(:where(.about-studio *)) h3 {
  font-size: clamp(21px, 1.85vw, 24px);
  line-height: 1.3;
  margin-bottom: 12px;
  max-width: 28ch;
}
:where(body:not(.about-studio)) .flow-list:not(:where(.about-studio *)) p {
  font-size: 17px;
  line-height: 1.65;
}
:where(body:not(.about-studio)) .flow-note:not(:where(.about-studio *)) {
  margin-top: 30px;
  max-width: 76ch;
  font-size: 15px;
  line-height: 1.6;
}
:where(body:not(.about-studio)) .scope-lines:not(:where(.about-studio *)) {
  margin-top: 34px;
}
:where(body:not(.about-studio)) .scope-lines:not(:where(.about-studio *)) > div {
  grid-template-columns: 40px minmax(0, .9fr) minmax(0, 1.25fr);
  gap: clamp(20px, 2.7vw, 38px);
  padding-block: 25px;
}
:where(body:not(.about-studio)) .scope-lines:not(:where(.about-studio *)) h3 {
  font-size: 22px;
  line-height: 1.3;
}
:where(body:not(.about-studio)) .scope-lines:not(:where(.about-studio *)) p {
  font-size: 17px;
  line-height: 1.65;
}

.dealer-page { --dealer-line: #6e597b; --dealer-panel: #211a29; }
.dealer-page main { overflow: clip; }
.dealer-page main [id] { scroll-margin-top: 120px; }
.dealer-page .dealer-section { padding-block: 62px; border-top: 1px solid var(--dealer-line); }
.dealer-page .dealer-hero { padding-block: 58px 62px; }
.dealer-page .dealer-hero h1 { max-width: 18ch; font-size: clamp(2.5rem, 4.8vw, 4.6rem); }
.dealer-page .dealer-intro { max-width: 65ch; margin-top: 24px; font-size: 20px; }
.dealer-page .dealer-intro p + p { margin-top: 16px; }
.dealer-page .dealer-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 18px 26px; margin-top: 28px; }
.dealer-page .dealer-link { display: inline-flex; align-items: center; min-height: 44px; text-decoration: underline; text-underline-offset: 5px; }
.dealer-page .dealer-grid { display: grid; grid-template-columns: 1fr 1.1fr; gap: 64px; align-items: start; }
.dealer-page .dealer-grid h2 { font-size: clamp(1.9rem, 3.3vw, 2.9rem); max-width: 20ch; }
.dealer-page .dealer-copy p + p { margin-top: 18px; }
.dealer-page .dealer-copy > a { margin-top: 14px; }
.dealer-page .dealer-steps { counter-reset: dealer; margin: 0; padding: 0; list-style: none; }
.dealer-page .dealer-steps li { counter-increment: dealer; padding: 18px 0 18px 48px; border-top: 1px solid var(--dealer-line); position: relative; }
.dealer-page .dealer-steps li:before { content: "0" counter(dealer); position: absolute; left: 0; top: 20px; color: var(--accent); font-family: var(--font); font-size: 14px; }
.dealer-page .dealer-steps h3 { font-size: 22px; margin-bottom: 8px; }
.dealer-page .dealer-steps p { font-size: 17px; }
.dealer-page .dealer-note { border-left: 3px solid var(--accent); padding: 14px 20px; margin-block: 24px 0; background: var(--dealer-panel); font-size: 16px; }
.dealer-page .dealer-note strong { color: var(--text); }
.dealer-page .dealer-meta { color: var(--accent); font-size: 14px; font-family: var(--font); margin-bottom: 14px; }
.dealer-page .dealer-faq h2 { font-size: clamp(2rem, 3vw, 2.8rem); margin-bottom: 28px; }
.dealer-page .dealer-close h2 { max-width: 24ch; }
.dealer-page .dealer-close p { max-width: 67ch; margin-top: 20px; }
.dealer-page .dealer-phone { display: inline-block; font-family: var(--font); font-size: clamp(1.8rem, 4vw, 2.6rem); line-height: 1.3; color: var(--text); font-variant-numeric: tabular-nums; margin-block: 12px 20px; text-decoration: underline; text-underline-offset: 8px; }
.dealer-page .dealer-demo-label { font-size: 14px; padding: 16px 20px; border: 1px solid var(--dealer-line); background: var(--dealer-panel); margin-block: 24px; }
.dealer-page .dealer-demo-label strong { color: var(--text); }
.dealer-page .dealer-demo-controls { display: flex; flex-wrap: wrap; gap: 10px; border: 0; padding: 0; margin: 0 0 26px; }
.dealer-page .dealer-demo-controls legend { font-size: 16px; margin-bottom: 12px; }
.dealer-page .dealer-demo-controls button { cursor: pointer; min-height: 48px; padding: 12px 18px; border: 1px solid var(--dealer-line); background: var(--dealer-panel); color: var(--text); border-radius: 2px; font-size: 16px; transition: background .15s; }
.dealer-page .dealer-demo-controls button:hover { background: #382c43; }
.dealer-page .dealer-demo-controls button[aria-pressed="true"] { background: var(--accent); color: #211329; border-color: var(--accent); }
.dealer-page .dealer-demo-controls button:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
.dealer-page .dealer-demo-layout { display: grid; grid-template-columns: 1.08fr 1fr; gap: 32px; }
.dealer-page .dealer-demo-layout > * { min-width: 0; }
.dealer-page .dealer-dialogue { margin: 0; padding: 0; list-style: none; }
.dealer-page .dealer-dialogue li { padding: 20px 0; border-top: 1px solid var(--dealer-line); }
.dealer-page .dealer-dialogue li:first-child { padding-top: 0; border-top: 0; }
.dealer-page .dealer-dialogue strong { font-size: 14px; color: var(--accent); }
.dealer-page .dealer-dialogue p { margin-top: 7px; }
.dealer-page .dealer-task { border: 1px solid var(--dealer-line); padding: 24px; background: var(--dealer-panel); }
.dealer-page .dealer-task h3 { margin-bottom: 14px; font-size: 25px; }
.dealer-page .dealer-record { margin: 0; }
.dealer-page .dealer-record > div { display: grid; grid-template-columns: 112px 1fr; gap: 16px; padding-block: 12px; border-top: 1px solid var(--dealer-line); font-size: 16px; line-height: 1.5; }
.dealer-page .dealer-record dt { color: var(--accent); }
.dealer-page .dealer-record dd { margin: 0; overflow-wrap: anywhere; }
.dealer-page .dealer-record .dealer-record-status { color: #f5eaff; font-weight: 600; }
.dealer-page .dealer-event { margin-top: 18px; border-left: 3px solid var(--accent); padding-left: 16px; font-size: 16px; }
.dealer-page .dealer-example-footnote { margin-top: 22px; font-size: 15px; }
.dealer-page .dealer-failure-details { margin-top: 28px; }
.dealer-page .dealer-failure-details summary { cursor: pointer; min-height: 48px; padding-block: 12px; }
.dealer-page .dealer-failure-details p { margin: 10px 0; }
.dealer-page .dealer-print-button { cursor: pointer; }
.dealer-page .worksheet-heading { max-width: 800px; }
.dealer-page .worksheet-intro { max-width: 77ch; margin-top: 22px; }
.dealer-page .worksheet-meta { display: flex; flex-wrap: wrap; gap: 25px 50px; padding-block: 26px; }
.dealer-page .worksheet-meta span { min-width: 220px; border-bottom: 1px solid var(--dealer-line); padding-bottom: 14px; }
.dealer-page .worksheet-scroll { overflow-x: auto; border: 1px solid var(--dealer-line); }
.dealer-page .worksheet-table { width: 100%; min-width: 1040px; border-collapse: collapse; font-size: 15px; }
.dealer-page .worksheet-table th { font-weight: 600; text-align: left; color: var(--text); background: var(--dealer-panel); line-height: 1.4; padding: 12px 10px; border: 1px solid var(--dealer-line); vertical-align: top; }
.dealer-page .worksheet-table td { height: 88px; border: 1px solid var(--dealer-line); padding: 10px; vertical-align: top; }
.dealer-page .worksheet-table th:first-child { width: 12%; }
.dealer-page .worksheet-table th:nth-child(2) { width: 9%; }
.dealer-page .worksheet-review { padding-left: 24px; margin-block: 22px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px 42px; }
.dealer-page .worksheet-review li { padding-left: 4px; }
.dealer-page .worksheet-print-address { display: none; }
.dealer-page [hidden] { display: none !important; }
@media (max-width: 800px) {
  .dealer-page .dealer-grid, .dealer-page .dealer-demo-layout { grid-template-columns: 1fr; gap: 30px; }
  .dealer-page .dealer-section { padding-block: 40px; }
  .dealer-page .dealer-hero { padding-block: 36px 40px; }
  .dealer-page .dealer-intro { font-size: 18px; }
  .dealer-page .dealer-demo-controls { flex-direction: column; align-items: stretch; }
  .dealer-page .dealer-demo-controls button { text-align: left; }
  .dealer-page .dealer-record > div { grid-template-columns: 94px 1fr; gap: 12px; }
  .dealer-page .worksheet-review { grid-template-columns: 1fr; }
}
@media (max-width: 400px) {
  .dealer-page .dealer-actions .button { width: 100%; }
  .dealer-page .dealer-task { padding: 20px 16px; }
  .dealer-page .dealer-record > div { grid-template-columns: 1fr; gap: 4px; }
}
@media (prefers-reduced-motion: reduce) {
  .dealer-page *, .dealer-page *::before, .dealer-page *::after { scroll-behavior: auto !important; transition: none !important; animation: none !important; }
}
@media print {
  @page { size: letter landscape; margin: 12mm; }
  body.worksheet-page { background: #fff !important; color: #000 !important; font-size: 10pt !important; }
  .worksheet-page .header, .worksheet-page .footer, .worksheet-page .skip-link, .worksheet-page .dealer-actions, .worksheet-page .worksheet-no-print, .worksheet-page .page-entry-line { display: none !important; }
  .worksheet-page .container { width: 100% !important; max-width: none !important; }
  .worksheet-page main { overflow: visible !important; }
  .worksheet-page .dealer-hero, .worksheet-page .dealer-section { padding: 0 !important; border: 0 !important; }
  .worksheet-page h1 { color: #000 !important; font-size: 23pt !important; max-width: none !important; letter-spacing: -.02em !important; }
  .worksheet-page h2 { color: #000 !important; font-size: 13pt !important; margin-top: 16px !important; }
  .worksheet-page p, .worksheet-page li, .worksheet-page th { color: #000 !important; }
  .worksheet-page .worksheet-intro { font-size: 10pt; max-width: none; margin-top: 10px; line-height: 1.35; }
  .worksheet-page .worksheet-meta { padding-block: 12px; font-size: 9pt; }
  .worksheet-page .worksheet-meta span { padding-bottom: 6px; border-color: #777; }
  .worksheet-page .worksheet-scroll { overflow: visible; border: 0; }
  .worksheet-page .worksheet-table { min-width: 0; font-size: 8pt; table-layout: fixed; }
  .worksheet-page .worksheet-table th { background: #eee !important; padding: 7px 5px; border-color: #777; }
  .worksheet-page .worksheet-table td { height: 51px; border-color: #777; padding: 5px; }
  .worksheet-page .worksheet-review { grid-template-columns: 1fr 1fr; font-size: 9pt; margin-block: 10px; gap: 5px 30px; }
  .worksheet-page .dealer-note { border: 0; background: none; padding: 0; font-size: 8.5pt; line-height: 1.4; margin-top: 12px; }
  .worksheet-page .worksheet-print-address { display: block; font-size: 8pt; margin-top: 8px; }
}

/* A single, inspectable dealer handoff. Scoped to the dealer landing page. */
.dealer-flow {
  --flow-surface: #1b1720;
  --flow-ink: #f5eefb;
  --flow-muted: #d0c4db;
  --flow-line: #796087;
  --flow-accent: #d9b4fa;
  --flow-track: #5f4d6b;
  --dealer-progress: 1;
  margin: 0;
  color: var(--flow-ink);
}
.dealer-page .dealer-flow-section { padding-block: 40px 44px; }
.dealer-flow-heading { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 28px; }
.dealer-page .dealer-flow-heading h2 { max-width: 24ch; font-size: clamp(1.8rem, 3vw, 2.65rem); line-height: 1.16; }
.dealer-flow-heading > p { color: var(--flow-muted); font-size: 14px; white-space: nowrap; }
.dealer-flow-board { position: relative; padding: 28px 28px 0; border: 1px solid var(--flow-line); border-radius: 4px; background: var(--flow-surface); box-shadow: inset 0 1px 0 #dfc5f440; }
.dealer-flow-ticket { display: flex; align-items: start; justify-content: space-between; gap: 28px; padding-bottom: 28px; border-bottom: 1px solid #514359; }
.dealer-flow-label { display: block; font-size: 13px; color: var(--flow-muted); margin-bottom: 8px; }
.dealer-flow-ticket p { color: var(--flow-ink); font-size: clamp(20px, 2.1vw, 28px); line-height: 1.3; font-weight: 550; letter-spacing: -.025em; }
.dealer-flow-stock { min-width: 0; max-width: 260px; }
.dealer-flow-stock strong { display: block; font-size: 19px; line-height: 1.3; font-variant-numeric: tabular-nums; font-weight: 650; color: var(--flow-accent); }
.dealer-flow-stock > span:last-child { display: block; margin-top: 6px; font-size: 13px; line-height: 1.45; color: var(--flow-muted); }
.dealer-flow-stages { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin: 0; padding: 0; list-style: none; }
.dealer-flow-stage { position: relative; min-width: 0; padding: 28px 22px 26px 0; }
.dealer-flow-stage:not(:first-child) { padding-left: 22px; }
.dealer-flow-stage:last-child { padding-right: 0; }
.dealer-flow-stage + .dealer-flow-stage::after { content: ''; position: absolute; top: 92px; bottom: 26px; left: 0; width: 1px; background: #514359; }
.dealer-flow-node { display: flex; position: relative; z-index: 1; align-items: center; justify-content: center; width: 36px; height: 36px; margin-bottom: 22px; border: 1px solid var(--flow-line); border-radius: 50%; background: var(--flow-surface); color: var(--flow-muted); font: 500 12px/1 var(--font, Archivo, sans-serif); font-variant-numeric: tabular-nums; transition: background .25s, border-color .25s, color .25s; }
.dealer-flow-stage h3 { color: var(--flow-ink); font-size: 16px; line-height: 1.35; font-weight: 650; letter-spacing: -.015em; margin-bottom: 18px; }
.dealer-flow-stage p { color: var(--flow-muted); font-size: 14px; line-height: 1.6; }
.dealer-flow-stage .dealer-flow-value { color: var(--flow-ink); font-size: 16px; font-weight: 550; line-height: 1.4; margin-bottom: 9px; }
.dealer-flow-state { display: block; color: var(--flow-muted); font-size: 12px; line-height: 1.5; margin-top: 18px; padding-top: 10px; border-top: 2px solid var(--flow-track); transition: color .25s, border-color .25s; }
.dealer-flow-track { position: relative; height: 2px; margin: 45px 18px -47px; background: var(--flow-track); width: calc(75% + 22px); pointer-events: none; }
.dealer-flow-track-fill { display: block; width: 100%; height: 100%; background: var(--flow-accent); transform: scaleX(var(--dealer-progress)); transform-origin: left; }
.dealer-flow-signal { position: absolute; top: -3px; left: calc(var(--dealer-progress) * 100%); width: 8px; height: 8px; border-radius: 50%; background: #fff; box-shadow: 0 0 12px #dab2fb; opacity: 0; transform: translateX(-50%); }
.dealer-flow[data-dealer-playing="true"] .dealer-flow-signal { opacity: 1; }
.dealer-flow[data-dealer-stage="0"] [data-flow-card="0"] .dealer-flow-node,
.dealer-flow[data-dealer-stage="1"] :is([data-flow-card="0"], [data-flow-card="1"]) .dealer-flow-node,
.dealer-flow[data-dealer-stage="2"] :is([data-flow-card="0"], [data-flow-card="1"], [data-flow-card="2"]) .dealer-flow-node,
.dealer-flow[data-dealer-stage="3"] .dealer-flow-node { background: var(--flow-accent); color: #211329; border-color: var(--flow-accent); }
.dealer-flow[data-dealer-stage="0"] [data-flow-card="0"] .dealer-flow-state,
.dealer-flow[data-dealer-stage="1"] [data-flow-card="1"] .dealer-flow-state,
.dealer-flow[data-dealer-stage="2"] [data-flow-card="2"] .dealer-flow-state,
.dealer-flow[data-dealer-stage="3"] .dealer-flow-state { color: var(--flow-accent); border-color: var(--flow-accent); }
.dealer-flow-fallback { display: flex; gap: 20px; padding-block: 18px; border-top: 1px solid #514359; align-items: baseline; }
.dealer-flow-fallback > span { color: var(--flow-accent); font-size: 13px; flex-shrink: 0; }
.dealer-flow-fallback p { color: var(--flow-muted); font-size: 14px; line-height: 1.5; }
.dealer-flow-controls { display: flex; align-items: start; justify-content: space-between; gap: 12px 24px; margin-top: 12px; }
.dealer-flow-chapters { display: flex; flex-wrap: wrap; column-gap: 24px; }
.dealer-flow-controls button { min-height: 44px; padding: 10px 0; border: 0; border-bottom: 1px solid transparent; background: transparent; color: var(--flow-muted); font: 400 13px/1.4 var(--font, Archivo, sans-serif); cursor: pointer; touch-action: manipulation; }
.dealer-flow-controls button:hover { color: #fff; border-bottom-color: var(--flow-accent); }
.dealer-flow-controls button[aria-pressed="true"] { color: var(--flow-accent); border-bottom-color: var(--flow-accent); }
.dealer-flow-controls button:focus-visible { outline: 2px solid var(--flow-accent); outline-offset: 4px; }
.dealer-flow-controls .dealer-flow-play { color: var(--flow-ink); flex-shrink: 0; }
.dealer-flow-disclosure { margin-top: 16px; font-size: 13px; line-height: 1.6; color: var(--flow-muted); }
.dealer-flow-more { margin-top: 3px; font-size: 14px; }
.dealer-flow-accessible { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
@media (max-width: 900px) {
  .dealer-flow-stage { padding-right: 14px; }
  .dealer-flow-stage:not(:first-child) { padding-left: 14px; }
  .dealer-flow-track { width: calc(75% + 14px); }
  .dealer-flow-stage h3 { min-height: 2.7em; }
}
@media (max-width: 680px) {
  .dealer-flow-heading { display: block; margin-bottom: 22px; }
  .dealer-flow-heading > p { margin-top: 12px; white-space: normal; }
  .dealer-flow-board { padding: 22px 20px 0; }
  .dealer-flow-ticket { display: block; padding-bottom: 22px; }
  .dealer-flow-stock { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 14px; max-width: none; margin-top: 20px; align-items: baseline; }
  .dealer-flow-stock .dealer-flow-label { margin: 0; }
  .dealer-flow-stock > span:last-child { grid-column: 1 / -1; margin-top: 2px; }
  .dealer-flow-track { display: none; }
  .dealer-flow-stages { grid-template-columns: minmax(0, 1fr); }
  .dealer-flow-stage, .dealer-flow-stage:not(:first-child), .dealer-flow-stage:last-child { padding: 22px 0 22px 56px; }
  .dealer-flow-stage + .dealer-flow-stage::after { display: none; }

</section></main><script>/* Illustrative dealer workflow. No requests, saved data or customer actions. */
(() => {
  'use strict';
  const STEP_MS = 2400;
  const DURATION_MS = STEP_MS * 4;

  document.querySelectorAll('[data-dealer-workflow]').forEach(root => {
    const controls = root.querySelector('[data-dealer-controls]');
    const play = root.querySelector('[data-dealer-play]');
    const announcement = root.querySelector('[data-dealer-announcement]');
    const steps = [...root.querySelectorAll('[data-dealer-step]')];
    if (!controls || !play || steps.length !== 4) return;

    const reduced = matchMedia('(prefers-reduced-motion: reduce)');
    let elapsed = reduced.matches ? DURATION_MS : 0;
    let wantsPlay = !reduced.matches;
    let visible = false;
    let frame = 0;
    let lastTime = null;

    const canPlay = () => wantsPlay && visible && !document.hidden && !reduced.matches && elapsed < DURATION_MS;
    function render() {
      const stage = Math.min(3, Math.floor(elapsed / STEP_MS));
      const progress = elapsed / DURATION_MS;
      root.dataset.dealerStage = String(stage);
      root.dataset.dealerPlaying = String(canPlay());
      root.dataset.dealerProgress = String(progress);
      root.style.setProperty('--dealer-progress', String(progress));
      steps.forEach(button => button.setAttribute('aria-pressed', String(Number(button.dataset.dealerStep) === stage)));
      play.hidden = reduced.matches;
      play.textContent = elapsed === DURATION_MS ? 'Replay animation' : wantsPlay ? 'Pause animation' : 'Resume animation';
    }
    function stopFrame() {
      if (frame) cancelAnimationFrame(frame);
      frame = 0;
      lastTime = null;
    }
    function sync() {
      if (canPlay()) {
        if (!frame) frame = requestAnimationFrame(tick);
      } else stopFrame();
      render();
    }
    function tick(time) {
      frame = 0;
      if (!canPlay()) { sync(); return; }
      if (lastTime !== null) elapsed = Math.min(DURATION_MS, elapsed + Math.max(0, time - lastTime));
      lastTime = time;
      if (elapsed === DURATION_MS) wantsPlay = false;
      sync();
    }
    function announce(message) {
      if (announcement) announcement.textContent = message;
    }

    play.addEventListener('click', () => {
      if (reduced.matches) return;
      if (elapsed === DURATION_MS) {
        elapsed = 0;
        wantsPlay = true;
        announce('Animation restarted.');
      } else {
        wantsPlay = !wantsPlay;
        announce(wantsPlay ? 'Animation resumed.' : 'Animation paused.');
      }
      sync();
    });
    steps.forEach(button => button.addEventListener('click', () => {
      const stage = Number(button.dataset.dealerStep);
      if (!Number.isInteger(stage) || stage < 0 || stage > 3) return;
      wantsPlay = false;
      elapsed = stage * STEP_MS;
      sync();
      announce(`Step ${stage + 1} of 4: ${button.textContent.trim()}`);
    }));
    root.addEventListener('focusin', event => {
      // Focusing the play control must not flip its action before a click.
      if (!wantsPlay || play.contains(event.target)) return;
      wantsPlay = false;
      sync();
      announce('Animation paused. Use the steps to inspect the workflow.');
    });
    document.addEventListener('visibilitychange', sync);
    reduced.addEventListener('change', () => {
      // A preference change never resumes motion without an explicit action.
      wantsPlay = false;
      elapsed = DURATION_MS;
      sync();
    });

    controls.hidden = false;
    if (typeof IntersectionObserver === 'function') {
      const observer = new IntersectionObserver(entries => {
        for (const entry of entries) {
          if (entry.target !== root) continue;
          visible = entry.isIntersecting;
          sync();
        }
      }, { threshold: 0 });
      observer.observe(root);
    } else {
      // Without visibility detection, leave playback to the visitor.
      visible = true;
      wantsPlay = false;
    }
    sync();
  });
})();
</script></body></html>
